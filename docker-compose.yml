services:
  # Base de datos MySQL
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: tag_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"

  # Backend Laravel
  backend:
    image: bitnami/laravel:latest
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app
    depends_on:
      - db

  # Frontend React
  frontend:
    image: bitnami/node:latest
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
    working_dir: /app
    command: bash -c "npm install && npm run dev -- --host"