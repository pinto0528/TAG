services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: tag_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"

  api:
    image: bitnami/laravel:latest
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app
    working_dir: /app
    # Esto salta los scripts de Bitnami y va directo al grano
    entrypoint: [ "php", "artisan", "serve", "--host=0.0.0.0", "--port=8000" ]
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=tag_db
      - DB_USERNAME=root
      - DB_PASSWORD=root
    depends_on:
      - db

  client:
    image: node:20-alpine
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
    working_dir: /app
    command: npm run dev -- --host
    depends_on:
      - api